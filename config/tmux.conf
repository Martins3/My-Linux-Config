# 使用 Ctrl h 作为 prefix
set -g prefix C-h

# tmux 内使用自己的终端类型；SSH 到旧系统时需在远端安装对应 terminfo。
# https://github.com/tmux/tmux/wiki/FAQ
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB:clipboard'
# 启用 OSC 52 Clipboard
set -s set-clipboard on

# 让 window 和 pane 的编号从 1 开始，因为 0 这个键实在是太远了
set -g base-index 1
setw -g pane-base-index 1

# 使用 Alt + num 来选择不同的 window
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 10

# 使用 Alt+hljk 来在不同的 pane 中移动
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# 增加状态栏的对比度
setw -g window-status-current-style fg=black,bg=yellow

# 将默认在底部的状态栏移动到上面去
set-option -g status-position top
# 定时刷新状态栏中的时钟；设为 0 会关闭定时刷新。
set-option -g status-interval 5

# 可以用鼠标直接调整 pane 的大小
set -g mouse on
# copy mode 使用 vi 按键
set-window-option -g mode-keys vi
# prefix v 进入到 copy mode ，原生的 tmux 为 prefix [
bind-key -T prefix v copy-mode

# 给当前窗口添加 emoji 表情
set-option -g window-status-current-format  '🧀 #{window_index}:#{b:pane_current_path}'

# 创建新的 window
bind c new-window -c "#{pane_current_path}"
# 水平创建新的 pane
bind '"' split-window -c "#{pane_current_path}"
# 垂直创建新的 pane
bind % split-window -h -c "#{pane_current_path}"

# 将 window 的名称自动修改为路径名称，便于区分
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# prefix f 向上搜索历史输出；copy mode 内使用原生 ?、/ 搜索和 f 行内跳转。
bind f copy-mode \; command-prompt -T search -p "(search up)" { send -X search-backward -- "%%" }

# 我一般会使用两个 session ，使用 Ctrl j 来切换 session
bind-key -n C-j switch-client -n

# 向应用传递扩展组合键，使用 CSI u 编码；需要支持这些选项的较新 tmux。
set -g extended-keys-format csi-u
set -g extended-keys on
# 解决 windows ssh 的问题，一个临时的 workaround 而已
set -s escape-time 10

# 加载插件
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # 历史缓冲、焦点事件、重复 prefix 等默认行为
run '~/.tmux/plugins/tpm/tpm'
